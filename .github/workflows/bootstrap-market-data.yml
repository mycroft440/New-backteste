name: Build adjusted B3 quotes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/bootstrap_market_data.py
      - .github/workflows/bootstrap-market-data.yml

permissions:
  contents: write

concurrency:
  group: adjusted-b3-quotes
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install market-data dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pandas>=2.2,<3" "yfinance>=0.2.65,<1"

      - name: Build and validate 40 adjusted daily quote files
        run: |
          set -euo pipefail
          python scripts/bootstrap_market_data.py
          test "$(find data/quotes -maxdepth 1 -type f -name '*.csv' | wc -l)" -eq 40

      - name: Commit quotes only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "No quote changes to commit."
            exit 0
          fi
          git commit -m "data: materialize 40 adjusted B3 quote series"
          git push origin HEAD:main
