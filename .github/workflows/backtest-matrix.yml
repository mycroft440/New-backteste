name: Run backtest matrix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/b3_backtest/backtest/**'
      - 'src/b3_backtest/strategies/**'
      - 'scripts/run_backtest_matrix.py'
      - 'tests/test_backtest_engine.py'
      - 'data/quotes/**'
      - '.github/workflows/backtest-matrix.yml'

permissions:
  contents: write

concurrency:
  group: backtest-matrix-main
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas pytest
      - name: Test execution engine
        env:
          PYTHONPATH: src
        run: pytest -q tests/test_backtest_engine.py tests/test_signal_strategies.py
      - name: Run 40 x 40 backtest matrix
        env:
          PYTHONPATH: src
        run: python scripts/run_backtest_matrix.py
      - name: Validate output
        run: |
          test -f results/backtests/strategy_summary.csv
          test -f results/backtests/strategy_ticker_results.csv
          test -f results/backtests/strategy_annual_results.csv
          test -f results/backtests/methodology.json
          test "$(($(wc -l < results/backtests/strategy_summary.csv) - 1))" -eq 40
          test "$(($(wc -l < results/backtests/strategy_ticker_results.csv) - 1))" -eq 1600
      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/backtests
          if git diff --cached --quiet; then
            echo 'No result changes to commit.'
          else
            git commit -m 'backtest: materialize 40-strategy results'
            git pull --rebase origin main
            git push
          fi
