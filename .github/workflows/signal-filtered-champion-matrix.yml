name: Validate signal-filtered champion matrix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/b3_backtest/strategies/**'
      - 'src/b3_backtest/portfolio/b3lab_champion.py'
      - 'src/b3_backtest/portfolio/signal_filtered_champion.py'
      - 'src/b3_backtest/portfolio/champion_engine.py'
      - 'src/b3_backtest/portfolio/engine.py'
      - 'src/b3_backtest/portfolio/__init__.py'
      - 'scripts/run_signal_filtered_champion_matrix.py'
      - 'tests/test_signal_filtered_champion.py'
      - '.github/workflows/signal-filtered-champion-matrix.yml'

permissions:
  contents: write

concurrency:
  group: signal-filtered-champion-main
  cancel-in-progress: true

jobs:
  matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas pytest
      - name: Run indicator-first portfolio tests
        env:
          PYTHONPATH: src
        run: pytest -q tests/test_signal_filtered_champion.py tests/test_b3lab_champion.py tests/test_signal_strategies.py
      - name: Run all 40 signal strategies through one rebalance manager
        env:
          PYTHONPATH: src
        run: python scripts/run_signal_filtered_champion_matrix.py
      - name: Validate 40-combination outputs
        run: |
          test -f results/portfolio/signal_filtered_champion/strategy_ranking.csv
          test -f results/portfolio/signal_filtered_champion/rebalance_selections.csv
          test -f results/portfolio/signal_filtered_champion/summary.json
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          root = Path('results/portfolio/signal_filtered_champion')
          ranking = pd.read_csv(root / 'strategy_ranking.csv')
          rebalances = pd.read_csv(root / 'rebalance_selections.csv')
          summary = json.loads((root / 'summary.json').read_text())

          assert len(ranking) == 40
          assert ranking['signal_strategy'].nunique() == 40
          assert ranking['rank'].tolist() == list(range(1, 41))
          assert summary['strategies_tested'] == 40
          assert summary['tickers'] == 40
          assert not rebalances.empty

          for row in rebalances.to_dict('records'):
              selected = str(row.get('selected_ticker') or '')
              if selected and selected != 'nan':
                  uptrend = {v for v in str(row['uptrend_tickers']).split(';') if v}
                  assert selected in uptrend
          PY
      - name: Commit matrix result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/portfolio/signal_filtered_champion
          if git diff --cached --quiet; then
            echo 'No matrix result changes to commit.'
          else
            git commit -m 'portfolio: materialize signal-filtered champion matrix'
            git pull --rebase origin main
            git push
          fi
